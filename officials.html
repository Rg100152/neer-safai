<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officials Directory | Neer Safai</title>
  <meta name="description" content="Directory of water and sanitation officers by state, designation and department." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: "#0b1320", ink2: "#0f1b2d", aqua: "#00f0ff", saffron: "#ff9933" }, fontFamily: { sans: ["Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] } } } };
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    try { if (!localStorage.getItem("ns_session")) location.replace("login.html?next=officials.html"); } catch (e) {}
  </script>
</head>
<body class="antialiased">
  <div id="navbar-placeholder"></div>

  <main class="page-shell">
    <section class="border-b border-white/10 bg-gradient-to-b from-[#0d1e30] to-transparent">
      <div class="container-x py-10 sm:py-12">
        <nav class="text-xs text-slate-500"><a href="index.html" class="hover:text-[#00f0ff]">Home</a> <span class="mx-2">/</span> <span class="text-slate-300">Officials</span></nav>
        <h1 class="mt-4 font-display text-3xl font-bold text-white sm:text-4xl">Officials Directory</h1>
        <p class="mt-2 max-w-2xl text-sm text-slate-400">Contact details of nodal water and sanitation officers. Demo data for academic use.</p>
      </div>
    </section>

    <section class="section-pad !pt-8">
      <div class="container-x">
        <div class="glass p-4 sm:p-5">
          <div class="grid gap-3 md:grid-cols-[1.4fr_1fr_auto]">
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500"></i>
              <input id="o-search" type="search" class="input !pl-11" placeholder="Search name, department, state…" />
            </div>
            <select id="o-state" class="select"><option value="">All states</option></select>
            <button type="button" id="o-clear" class="btn btn-ghost !px-4"><i class="fa-solid fa-filter-circle-xmark"></i> Clear</button>
          </div>
        </div>

        <div class="glass mt-5 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="data-table min-w-[820px]">
              <thead>
                <tr>
                  <th>Officer</th>
                  <th>Designation</th>
                  <th>Department</th>
                  <th>State</th>
                  <th>Contact</th>
                  <th class="text-right">Action</th>
                </tr>
              </thead>
              <tbody id="officials-rows"></tbody>
            </table>
          </div>
          <p class="border-t border-white/10 px-5 py-3 text-xs text-slate-500"><span id="o-count">0</span> officers listed · Data is illustrative.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!NS.auth.requireAuth()) return;
      const rows = document.getElementById("officials-rows");
      const search = document.getElementById("o-search");
      const stateSel = document.getElementById("o-state");
      const count = document.getElementById("o-count");

      const states = Array.from(new Set(NS_DATA.officials.map((o) => o.state))).sort();
      stateSel.innerHTML = '<option value="">All states</option>' + states.map((s) => `<option>${NS.esc(s)}</option>`).join("");

      const avatarColors = ["bg-[#00f0ff]/15 text-[#00f0ff]", "bg-[#ff9933]/15 text-[#ff9933]", "bg-emerald-400/15 text-emerald-300", "bg-sky-400/15 text-sky-300"];

      function initials(name) {
        return name.replace(/^(Dr\.|Shri|Smt\.)\s*/i, "").split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        const st = stateSel.value;
        const list = NS_DATA.officials.filter((o) => {
          const hay = `${o.name} ${o.designation} ${o.dept} ${o.state}`.toLowerCase();
          return (!q || hay.includes(q)) && (!st || o.state === st);
        });
        count.textContent = list.length;
        if (!list.length) {
          rows.innerHTML = `<tr><td colspan="6" class="py-14 text-center text-sm text-slate-500"><i class="fa-solid fa-user-slash mr-2"></i> No officers match your search.</td></tr>`;
          return;
        }
        rows.innerHTML = list.map((o, i) => `
          <tr>
            <td>
              <div class="flex items-center gap-3">
                <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-xs font-bold ${avatarColors[i % avatarColors.length]}">${NS.esc(initials(o.name))}</span>
                <div><p class="font-medium text-white">${NS.esc(o.name)}</p><p class="text-xs text-slate-500">${NS.esc(o.email)}</p></div>
              </div>
            </td>
            <td class="text-slate-300">${NS.esc(o.designation)}</td>
            <td class="text-slate-400">${NS.esc(o.dept)}</td>
            <td><span class="badge badge-review">${NS.esc(o.state)}</span></td>
            <td class="whitespace-nowrap text-slate-400">${NS.esc(o.phone)}</td>
            <td class="text-right">
              <a href="mailto:${NS.esc(o.email)}" class="inline-grid h-9 w-9 place-items-center rounded-lg border border-white/10 text-slate-400 hover:border-[#00f0ff] hover:text-[#00f0ff]" title="Email"><i class="fa-solid fa-envelope"></i></a>
              <a href="tel:${NS.esc(o.phone.replace(/\s/g, ""))}" class="ml-1 inline-grid h-9 w-9 place-items-center rounded-lg border border-white/10 text-slate-400 hover:border-[#00f0ff] hover:text-[#00f0ff]" title="Call"><i class="fa-solid fa-phone"></i></a>
            </td>
          </tr>`).join("");
      }

      search.addEventListener("input", render);
      stateSel.addEventListener("change", render);
      document.getElementById("o-clear").addEventListener("click", () => { search.value = ""; stateSel.value = ""; render(); });
      render();
    });
  </script>
</body>
</html>
